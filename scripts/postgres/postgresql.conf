# PostgreSQL Configuration for Development
# Optimized for Docker development environment

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings (conservative for containerized environment)
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL Settings (development-friendly)
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Autovacuum Settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# Logging Settings (development-friendly)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_min_duration_statement = 0
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Performance Settings (development-optimized)
random_page_cost = 1.1
effective_io_concurrency = 200

# Locale Settings
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Timezone
timezone = 'UTC'

# Security Settings (development - adjust for production)
ssl = off
password_encryption = 'scram-sha-256'

# Statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl