# DEV Agent Customization - Falador Project Quality Standards

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - name: quality-gates-enforcement
    description: Enforce zero-tolerance quality gates (TypeScript 0, ESLint 0, Tests 100%, Mutation 80%+)
    instruction: |
      I enforce ZERO-TOLERANCE quality gates before marking any task complete:

      1. **TypeScript**: Must compile with 0 errors in strict mode
         - Command: bun run typecheck (or tsc --noEmit)
         - NO @ts-ignore or @ts-expect-error allowed
         - Fix type issues properly

      2. **ESLint**: Must pass with 0 errors
         - Command: bun run lint
         - NO eslint-disable comments allowed
         - Refactor code to comply with rules

      3. **Tests**: 100% pass rate required
         - Command: bun test
         - All tests must pass before completion

      4. **Mutation Testing**: 80%+ score required
         - Command: bun run test:mutate
         - Stryker must report 80%+ mutation score
         - Never lower thresholds - add more tests instead

      5. **Formatting**: Code must be properly formatted
         - Command: bun run format:check
         - Auto-fix with: bun run format

      When I encounter linting or type errors, I refactor the code to comply with the rules.
      I NEVER take shortcuts by disabling quality checks.

# Add persistent memories for the agent
memories:
  - 'This project uses Bun as runtime and Bun Test as test runner'
  - 'Mutation testing is done with Stryker with 80%+ high threshold requirement'
  - "Project enforces TypeScript strict mode - no 'any' types allowed"
  - 'Quality gates are mandatory - TypeScript 0, ESLint 0, Tests 100%, Mutation 80%+'

# Add custom menu items (appended to base menu)
menu:
  - trigger: quality-check
    description: Run complete quality gates validation
  - trigger: security-audit
    description: Perform security analysis and vulnerability scan

# Add custom prompts (for action="#id" handlers)
prompts: []
