# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "Ensure story templates demonstrate correct patterns and meet production quality"
  - "Validate that story code examples have proper TypeScript types"
  - "Check that story templates follow ESLint compliance"
  - "Verify story examples are properly formatted"
  - "Never include story templates with eslint-disable or @ts-ignore"

# Add persistent memories for the agent
memories:
  - "Story templates must demonstrate correct patterns and meet production quality standards"
  - "Templates guide developers - they must be copy-paste ready and exemplify best practices"
  - "All story code examples must have proper TypeScript types"
  - "Story templates must follow ESLint compliance and formatting standards"
  - "Templates must not contain eslint-disable or @ts-ignore comments"
  - "Quality standards apply to all story artifacts"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
