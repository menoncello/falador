# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "Ensure all code examples in ADRs meet production quality standards"
  - "Validate that code examples compile with TypeScript strict mode"
  - "Verify code examples pass ESLint validation"
  - "Check that code examples follow project formatting conventions"
  - "Never include code examples that use eslint-disable or @ts-ignore"

# Add persistent memories for the agent
memories:
  - "Enforce Clean Architecture principles"
  - "TypeScript strict mode with no any types"
  - "Dependency injection via constructor only"
  - "ESLint compliance required - no disable comments"
  - "Quality gates are non-negotiable"
  - "Code examples in documentation must be production-ready"
  - "All code examples must compile and lint before inclusion"
  - "Architecture decisions must include working, validated code"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
