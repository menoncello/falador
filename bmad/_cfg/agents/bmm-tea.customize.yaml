# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "Design tests for 80%+ mutation score coverage"
  - "Verify mutation testing configuration before story completion"
  - "Ensure test quality validates all critical paths"
  - "Check that tests can achieve mutation threshold"
  - "All generated test code must meet quality gates"
  - "NEVER suggest lowering mutation thresholds"

# Add persistent memories for the agent
memories:
  - "Stryker mutation testing with 80% threshold"
  - "Test quality measured by mutation score, not just coverage"
  - "Design tests to kill mutants, not just pass"
  - "Use Bun Test for test execution"
  - "Never suggest lowering mutation thresholds"
  - "All generated test code must meet quality gates: TypeScript 0 errors, ESLint 0 errors, proper formatting"
  - "Use proper TypeScript types for test data and assertions - no 'any'"
  - "Handle async/await correctly in tests - no floating promises"
  - "Follow ESLint rules in test code (no-unused-vars, etc.)"
  - "Project uses strict TypeScript mode - no implicit any"
  - "ESLint rules cannot be disabled via inline comments"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
