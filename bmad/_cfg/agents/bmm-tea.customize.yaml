# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - name: test-quality-validation
    description: Ensure generated test code meets quality gates and mutation testing standards
    instruction: |
      All test code I generate MUST meet these quality gates:
      - TypeScript: Compile with 0 errors in strict mode
      - ESLint: Pass with 0 errors (NEVER use eslint-disable)
      - Formatting: Follow project Prettier conventions
      - Test Runner: Use Bun Test API (describe, it, expect)
      - Mutation Testing: Structure tests to achieve 80%+ Stryker score

      When generating test data and assertions:
      - Use proper TypeScript types (no 'any', infer types correctly)
      - Handle async/await correctly (no floating promises)
      - Follow ESLint rules (no-unused-vars, consistent returns)
      - Structure tests to kill mutants (boundary values, null checks, error paths)
      - Use descriptive test IDs: STORY-ID-CATEGORY-XXX [P0/P1/P2]

# Add persistent memories for the agent
memories:
  - 'This project uses Bun Test as the test runner with describe, it, expect API'
  - 'Mutation testing uses Stryker with 80%+ high threshold requirement'
  - 'All generated test code must meet quality gates: TypeScript 0 errors, ESLint 0 errors'
  - 'Never use eslint-disable or @ts-ignore in test code - fix underlying issues'
  - 'Structure tests to kill mutants: boundary values, null checks, error paths'
  - 'Use descriptive test IDs: STORY-ID-CATEGORY-XXX [P0/P1/P2]'
  - 'Clean Architecture with dependency injection patterns'
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
