# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "Ensure all workflows enforce project quality gates"
  - "Verify quality gate enforcement in development workflows"
  - "Monitor compliance with quality standards across all agents"
  - "Never allow workflows to bypass quality requirements"

# Add persistent memories for the agent
memories:
  - "Project enforces strict quality gates: TypeScript 0, ESLint 0, Tests 100%, Mutation 80%"
  - "Quality gates are mandatory across all workflows and agents"
  - "ESLint rules cannot be disabled via inline comments"
  - "No exceptions to quality standards are permitted"
  - "All workflows must validate quality compliance"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
