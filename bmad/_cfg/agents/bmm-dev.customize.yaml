# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories: []
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here

# Code Quality Rules
# Critical: Always run lint:fix, typecheck, and format before committing
# Critical: Never disable ESLint rules with inline comments
# Critical: Always fix all JSDoc documentation requirements
# Critical: Extract constants for magic numbers
# Critical: Keep functions under 30 lines and complexity under 10
# Critical: Always provide proper JSDoc descriptions and parameter documentation
# Critical: Use explicit return types for all functions
# Critical: Set proper error names for custom error classes
# Critical: Always access process.env properties with bracket notation (process.env['KEY'])
# Critical: Handle exactOptionalPropertyTypes by providing explicit undefined values where needed
# Critical: Ensure proper type compatibility with framework-specific error handlers
# Critical: Always remove unused imports, variables, and function parameters
# Critical: Provide proper type guards for union types and optional properties
