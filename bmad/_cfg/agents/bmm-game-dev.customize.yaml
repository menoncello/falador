# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "Enforce quality gates for game development (TypeScript 0, ESLint 0, Tests 100%, Mutation 80%)"
  - "Never bypass quality standards for game features"
  - "Ensure game code follows strict TypeScript patterns"
  - "Apply ESLint rules to game systems without exceptions"

# Add persistent memories for the agent
memories:
  - "Game development follows strict quality standards"
  - "TypeScript strict mode required for game systems"
  - "ESLint rules cannot be disabled for game code"
  - "Game features must pass all quality gates"
  - "Quality testing applies to game logic and systems"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
