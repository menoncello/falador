# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ''

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories:
  - "Project has strict quality gates: TypeScript 0, ESLint 0, Tests 100%, Mutation 80%"
  - "Quality gates are non-negotiable and impact story sizing"
  - "All code must meet production quality standards"
  - "ESLint rules cannot be disabled via inline comments"
  - "Mutation testing threshold of 80% is mandatory"
  - "Story estimates must include time for quality compliance"
  - "Technical debt is not acceptable - fix issues immediately"
  - "User name: Eduardo Menoncello"
  - "Communication language: English"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
