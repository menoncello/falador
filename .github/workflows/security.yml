name: Security Scan (Advanced)

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - dependencies-only
          - code-only

jobs:
  security-scan:
    name: Advanced Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        scan-type: [dependencies, code, secrets]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Trivy vulnerability scanner
        if: matrix.scan-type == 'dependencies'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        if: matrix.scan-type == 'dependencies'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP ZAP Baseline Scan
        if: matrix.scan-type == 'code'
        run: |
          # Start the API server in background
          bun run dev &
          SERVER_PID=$!

          # Wait for server to start
          sleep 10

          # Run ZAP baseline scan
          docker run -t owasp/zap2docker-stable zap-baseline.py \
            -t http://localhost:3000 \
            -J zap-report.json || true

          # Stop the server
          kill $SERVER_PID || true

      - name: Run Gitleaks secret scanner
        if: matrix.scan-type == 'secrets'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit (fallback)
        if: matrix.scan-type == 'dependencies'
        run: |
          if command -v npm &> /dev/null; then
            npm audit --audit-level=high
          fi

      - name: Check for security misconfigurations
        if: matrix.scan-type == 'code'
        run: |
          echo "Checking for security misconfigurations..."

          # Check for exposed environment variables
          grep -r "process.env\." packages/ --include="*.ts" --include="*.js" | \
            grep -v "NODE_ENV\|PORT\|DATABASE_URL\|REDIS_URL" || true

          # Check for debug modes
          grep -r "DEBUG.*=" packages/ --include="*.ts" --include="*.js" || true

          # Check for insecure headers
          grep -r "Access-Control-Allow-Origin: \*" packages/ --include="*.ts" --include="*.js" || true

  generate-security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: security-scan
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Generate security summary
        run: |
          cat > security-summary.md << 'EOF'
          # Security Scan Summary

          ## Scan Results
          - **Date**: $(date -u)
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}

          ## Vulnerabilities Found
          The security scan completed. Check the Security tab in GitHub for detailed findings.

          ## Recommendations
          1. Review high-priority security findings immediately
          2. Update dependencies with known vulnerabilities
          3. Implement security best practices in code
          4. Regular security training for development team

          EOF

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-summary.md
          retention-days: 90