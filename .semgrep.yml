# Custom Semgrep configuration for Falador project
rules:
  - id: falador-no-hardcoded-secrets
    pattern: |
      $KEY = "..."
    message: Hardcoded secret detected. Use environment variables or secure configuration.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      owasp: "A05:2021 - Security Misconfiguration"
      category: security

  - id: falador-no-sql-injection
    pattern: |
      $QUERY + $INPUT
    message: Potential SQL injection vulnerability. Use parameterized queries.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      category: security

  - id: falador-password-strength
    pattern: |
      password == $VALUE
    message: Password comparison detected. Use secure password hashing and verification.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  - id: falador-no-console-errors
    pattern: |
      console.error($DATA)
    message: Avoid logging sensitive data in production environments.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      category: best-practices

  - id: falador-no-hardcoded-ports
    pattern: |
      port: $PORT
    message: Avoid hardcoded ports. Use environment variables.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: best-practices